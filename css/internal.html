  <!-- 
    internal : we apply internal css in <style> h1 { color: red;}  </style>  
    -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<!-- html comment -->
	
	<style>
		
		h2,h3{ color:yellow;background-color:red;text-align:center }
		
		.test1{
			color:green;
			background-color:pink;
			text-align:right
		}
		
		.upper{ text-transform:uppercase }
		
		.underline{ text-decoration: underline }
		
		#test2{
			color:red;
			background-color:pink;
			text-align:left
		}
		
		h4.test3{
			background-color:red;
			color:white
		}
		
		.box{
			width:200px;
			height:100px;
			background-color:red;
			color:white
		}
		
		.box h5{
			background-color:yellow;
		}
		
	</style>
	
</head>
<body>
	
    <h2>Hi i am inline css</h2>
	<h2>Hi i am inline css</h2>
	<h2>Hi i am inline css</h2>
	
	<h3>Hi i am inline css</h3>
	<h3>Hi i am inline css</h3>
	
	<p class="test1 underline">Hi how are you !</p>
	<p class="test1 upper underline">Hi how are you !</p>
	<p class="test1">Hi how are you !</p>
	
	<p id="test2">Hi how are you !</p>
	<p id="test2">Hi how are you !</p>
	<p id="test2">Hi how are you !</p>
	
	<h4 class="test3">Hello </h4>
	
	<div class="box">
		Hello
		<h5>Hello h5</h5>
	</div>
	
	
	<h5>Hello h5</h5>
	
</body>
</html>
